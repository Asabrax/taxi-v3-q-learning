[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taxi-q-learning"
version = "0.1.0"
description = "A tabular Q-learning agent for Gymnasium Taxi-v3."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium[toy-text]>=0.29.1,<1.3.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
